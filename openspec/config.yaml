schema: spec-driven

context: |
  Project: Freyza Employee Admin Dashboard
  Tech Stack: SvelteKit (Svelte 5 runes), TypeScript, TailwindCSS v4, bits-ui.
  Database: Supabase (PostgreSQL), Drizzle ORM.
  Validation: Valibot (strictly NO Zod).
  Runtime: Bun (Vite with experimental Bun support).

  Architecture Rules:
  1. Data Fetching: 3-layer architecture. Components call `*.remote.ts` functions. Remote functions call `server/db/*.ts` database functions.
  2. Component State: Strictly use Svelte 5 `$props()`, `$state()`, and `$derived()`.
  3. DB Returns: All DB functions must return `{ data: T, error: null } | { data: null, error: string }`.
  4. Auth: Use `requireAuthMaybeAdmin(locals)` in server/remote functions.
  5. UI Patterns: Use `<svelte:boundary>` with `{#await}` blocks for async rendering.

  Component Patterns:
  - Dashboard employee components: `EmployeeItem.svelte`, `EmployeeList.svelte`, `EmployeeSelectComboBox.svelte`, `AddEmployeeButton.svelte`
  - Travel plan components: `PlanCalendar.svelte`, `TravelPlanCard.svelte`, `AddTravelPlanCard.svelte`, `ViewPlanCalendar.svelte`
  - Daily report components: `DailyReportCard.svelte`
  - Layout components: `AppNavbar.svelte`, `AppSidebar.svelte`, `PageHeader.svelte`, `AdminProfileCard.svelte`, `UserCard.svelte`
  - Visit component: `VisitCard.svelte`
  - Task components: `TasksList.svelte`
  - Reusable components: `AccountDropdown.svelte`, `Navbar.svelte`, `RouteSelectComboBox.svelte`
  - UI components: `collapsible`, `switch`, `tooltip`, `progress`, `popover`, `dropdown-menu`, `field`, `button-group`, `spinner`, `empty`, `separator`, `command`, `input`, `input-group`, `scroll-area`

  Specs Directory Suggestions:
  - `auth/` - Authentication system
  - `employee/` - Employee management
  - `geography/` - Geographic/location data
  - `travel-plans/` - Travel plan management
  - `reports-and-visits/` - Daily reports and visits
  - `code-ui/` - UI component library

  Routes:
  - `/admin` - Dashboard home
  - `/admin/employees` - Employee management
  - `/admin/dailyreport` - Daily reports list
  - `/admin/dailyreport/[reportId]` - Daily report detail
  - `/admin/travelplan` - Travel plans list
  - `/admin/travelplan/[tpId]` - Travel plan detail
  - `/admin/travelplan/[y=year]-[m=month]` - Travel plan calendar view
  - `/admin/travelplan/create` - Create travel plan

rules:
  proposal:
    - Always outline how the database schema, remote functions, and UI interact.
    - Propose Valibot schemas for any new data input.
  tasks:
    - Separate tasks into "Database", "Remote API", and "Frontend" logical steps.
    - Never write raw SQL; always output Drizzle ORM syntax.
